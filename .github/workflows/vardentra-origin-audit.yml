name: Vardentra origin storefront audit 2026-08-09

on:
  push:
    branches:
      - agent/vardentra-origin-audit-20260809
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 cheerio@1.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run authenticated origin audit
        shell: bash
        run: |
          mkdir -p audit/screenshots audit/policies
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');
          const ORIGIN = new URL('https://vardentra.myshoplaza.com/');
          const SOURCE = new URL('https://ibenry.com/');
          const PASSWORD = '123' + '456';
          const wait = ms => new Promise(r => setTimeout(r, ms));
          const clean = v => String(v || '').replace(/\s+/g, ' ').trim();
          const safe = v => v === '/' ? 'home' : v.replace(/^\//,'').replace(/[?&#=/]+/g,'-').replace(/-+$/,'').slice(0,140);
          const toOrigin = href => {
            try { const u = new URL(href, ORIGIN); return new URL(u.pathname + u.search, ORIGIN).href; }
            catch { return ''; }
          };
          const csv = (file, rows) => {
            if (!rows.length) return fs.writeFileSync(file, '');
            const heads = [...new Set(rows.flatMap(r => Object.keys(r)))];
            const esc = v => { const s = typeof v === 'object' ? JSON.stringify(v) : String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
            fs.writeFileSync(file, [heads.map(esc).join(','), ...rows.map(r => heads.map(h => esc(r[h])).join(','))].join('\n') + '\n');
          };

          const coreRoutes = [
            '/',
            '/collections/all-products','/collections/car-lift','/collections/cardio-machines','/collections/electric-bicycles','/collections/fishing-kayaks','/collections/garden-essentials','/collections/gazebo-pergolas','/collections/handy-mowers','/collections/home-finds','/collections/portable-generators','/collections/ride-mowers','/collections/sheds','/collections/swing-sets','/collections/trampoline',
            '/pages/about-us','/pages/contact-us','/pages/faqs','/pages/order-status','/pages/shipping-policy','/pages/refund-and-returns-policy','/pages/privacy-policy','/pages/terms-of-service','/pages/billing-policy','/pages/cookie-policy','/pages/wishlist','/pages/compare',
            '/cart','/search?q=mower','/account','/account/login','/account/register','/account/forgot-password',
            '/order-verify','/account/order_lookup','/pages/billing-terms','/pages/warranty-policy','/pages/wholesale-policy','/pages/security-reporting'
          ];
          const policyRoutes = coreRoutes.filter(r => r.startsWith('/pages/') && !['/pages/wishlist','/pages/compare'].includes(r));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1050 }, ignoreHTTPSErrors: true, locale: 'en-US' });
            const auth = await context.request.post(new URL('/api/password/v2', ORIGIN).href, { form: { password: PASSWORD }, failOnStatusCode: false, maxRedirects: 10, timeout: 60000 });

            // Pull all 608 source handles so every target product route can be tested.
            const sourceProducts = [];
            for (let page = 1; page <= 20; page++) {
              const response = await context.request.get(new URL('/wp-json/wc/store/v1/products', SOURCE).href, { params: { per_page: 100, page }, failOnStatusCode: false, timeout: 60000 });
              if (response.status() >= 400) break;
              const list = await response.json().catch(() => []);
              if (!Array.isArray(list) || !list.length) break;
              sourceProducts.push(...list);
              const totalPages = Number(response.headers()['x-wp-totalpages'] || page);
              if (page >= totalPages) break;
            }

            const routeRows = [];
            const policyData = {};
            const linkSet = new Set();
            for (const route of coreRoutes) {
              try {
                const response = await context.request.get(new URL(route, ORIGIN).href, { failOnStatusCode: false, maxRedirects: 10, timeout: 45000 });
                const html = await response.text();
                const $ = cheerio.load(html);
                const title = clean($('title').first().text());
                const h1 = clean($('h1').first().text());
                const metaDescription = $('meta[name="description"]').attr('content') || '';
                const canonical = $('link[rel="canonical"]').attr('href') || '';
                const bodyText = clean($('main,#MainContent,[role="main"],body').first().text());
                $('a[href]').each((_, node) => { const url = toOrigin($(node).attr('href')); if (url) linkSet.add(url); });
                routeRows.push({ route, status: response.status(), final_url: response.url(), title, h1, meta_description: metaDescription, canonical, text_length: bodyText.length, has_h1: !!h1 });
                if (policyRoutes.includes(route)) {
                  $('script,style,nav,header,footer,form').remove();
                  const text = clean($('main,#MainContent,[role="main"],article,.page-content,body').first().text());
                  policyData[route] = { status: response.status(), final_url: response.url(), title, h1, text };
                  fs.writeFileSync(`audit/policies/${safe(route)}.txt`, text);
                }
              } catch (error) { routeRows.push({ route, error: String(error) }); }
            }

            const productRouteRows = [];
            let productCursor = 0;
            async function productWorker() {
              while (productCursor < sourceProducts.length) {
                const product = sourceProducts[productCursor++];
                const route = `/products/${product.slug}`;
                try {
                  const response = await context.request.get(new URL(route, ORIGIN).href, { failOnStatusCode: false, maxRedirects: 8, timeout: 45000 });
                  const html = await response.text();
                  const $ = cheerio.load(html);
                  const text = clean($('body').text());
                  productRouteRows.push({
                    source_product_id: product.id, handle: product.slug, route, status: response.status(), final_url: response.url(), html_length: html.length,
                    has_title: $('h1').length > 0, has_add_to_cart: /add to cart/i.test(text), has_buy_now: /buy now/i.test(text),
                    has_sku_label: /\bSKU\s*:/i.test(text), has_category_label: /\bCategory\s*:/i.test(text), has_brand_label: /\bBrand\s*:/i.test(text),
                    has_description: /\bDescription\b/i.test(text), has_related_products: /Related Products|You may also like/i.test(text),
                    old_identity: /\bIbenry\b|ibenry\.com|IBENRY GROUP/i.test(text), image_refs: $('img').length
                  });
                } catch (error) { productRouteRows.push({ source_product_id: product.id, handle: product.slug, route, error: String(error) }); }
              }
            }
            await Promise.all(Array.from({ length: 15 }, () => productWorker()));
            productRouteRows.sort((a,b) => String(a.handle).localeCompare(String(b.handle)));

            const linkRows = [];
            const links = [...linkSet].slice(0, 2500);
            let linkCursor = 0;
            async function linkWorker() {
              while (linkCursor < links.length) {
                const href = links[linkCursor++];
                try {
                  const response = await context.request.get(href, { failOnStatusCode: false, maxRedirects: 10, timeout: 30000 });
                  linkRows.push({ href, status: response.status(), final_url: response.url(), content_type: response.headers()['content-type'] || '' });
                } catch (error) { linkRows.push({ href, error: String(error) }); }
              }
            }
            await Promise.all(Array.from({ length: 18 }, () => linkWorker()));

            const page = await context.newPage();
            const consoleErrors = [], pageErrors = [], failedRequests = [];
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push({ page: page.url(), text: message.text() }); });
            page.on('pageerror', error => pageErrors.push({ page: page.url(), text: String(error.stack || error) }));
            page.on('requestfailed', request => failedRequests.push({ page: page.url(), url: request.url(), reason: request.failure()?.errorText || '' }));
            const goto = async (route, delay = 800) => { const response = await page.goto(new URL(route, ORIGIN).href, { waitUntil: 'domcontentloaded', timeout: 90000 }); await wait(delay); return response; };

            const domRows = [];
            async function inspectDom(route, screenshot = false) {
              const response = await goto(route, route === '/' ? 2500 : 900);
              if (screenshot) await page.screenshot({ path: `audit/screenshots/${safe(route)}.png`, fullPage: true }).catch(() => {});
              const data = await page.evaluate(() => {
                const visible = element => !!(element.offsetWidth || element.offsetHeight || element.getClientRects().length);
                const main = document.querySelector('main,#MainContent,[role="main"]') || document.body;
                const images = [...document.images].map(image => ({ src: image.currentSrc || image.src, displayed: visible(image), complete: image.complete, naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight }));
                return {
                  title: document.title, h1: document.querySelector('h1')?.innerText?.trim() || '', textLength: cleanText(main.innerText || '').length,
                  productCards: document.querySelectorAll('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').length,
                  brokenImages: images.filter(image => image.displayed && (!image.complete || !image.naturalWidth)),
                  horizontalOverflow: document.body.scrollWidth > document.body.clientWidth + 2,
                  buttons: [...document.querySelectorAll('button,input[type="submit"],a[role="button"],.button,.btn')].filter(visible).map(button => ({ text: cleanText(button.innerText || button.value || button.getAttribute('aria-label') || ''), disabled: !!button.disabled || button.getAttribute('aria-disabled') === 'true', href: button.href || '', formAction: button.form?.action || '' })),
                  forms: [...document.forms].map(form => ({ action: form.action, method: form.method, inputs: [...form.elements].map(element => ({ name: element.name, type: element.type, required: !!element.required })).filter(item => item.name) }))
                };
                function cleanText(value) { return String(value || '').replace(/\s+/g,' ').trim(); }
              });
              domRows.push({ route, status: response?.status() || '', ...data, broken_images: data.brokenImages.length });
            }
            for (const route of ['/', '/collections/all-products', '/pages/order-status', '/cart', '/search?q=mower']) await inspectDom(route, true).catch(error => domRows.push({ route, error: String(error) }));

            const sampleProducts = [];
            const sampleCount = Math.min(40, sourceProducts.length);
            for (let index = 0; index < sampleCount; index++) sampleProducts.push(sourceProducts[Math.floor(index * sourceProducts.length / sampleCount)]);
            const productRows = [];
            for (const product of sampleProducts) {
              const route = `/products/${product.slug}`;
              try {
                const response = await goto(route, 950);
                const data = await page.evaluate(() => {
                  const visible = element => !!(element.offsetWidth || element.offsetHeight || element.getClientRects().length);
                  const meta = [...document.querySelectorAll('.vd-product-identity li,.vd-product-taxonomy li,.product-meta li,[data-product-meta]')].map(node => cleanText(node.innerText || ''));
                  const description = document.querySelector('[data-tab-panel="description"],.vd-product-description,.product-description,.rte');
                  const gallery = document.querySelector('.vd-product-gallery,.product-gallery,[data-product-gallery]');
                  const stage = gallery?.querySelector('.vd-product-stage,.product-main-image,[data-product-stage]');
                  const images = [...document.images].map(image => ({ displayed: visible(image), complete: image.complete, naturalWidth: image.naturalWidth }));
                  return {
                    h1: document.querySelector('h1')?.innerText?.trim() || '', meta,
                    sku: [...document.querySelectorAll('[data-sku-value],[data-product-sku],.vd-product-sku,.sku')].map(node => cleanText(node.innerText || '')).filter(Boolean),
                    prices: [...document.querySelectorAll('.vd-product-price,.price,[data-product-price],.money')].map(node => cleanText(node.innerText || '')).filter(Boolean).slice(0,8),
                    descriptionWords: (description?.innerText || '').trim().split(/\s+/).filter(Boolean).length,
                    gallery: stage ? { width: stage.getBoundingClientRect().width, height: stage.getBoundingClientRect().height } : null,
                    relatedCards: document.querySelectorAll('[data-related-grid] [data-product-card],.vd-related [data-product-card],.related-products [data-product-card],.related-products .shoplazza-product-snippet').length,
                    brokenImages: images.filter(image => image.displayed && (!image.complete || !image.naturalWidth)).length,
                    horizontalOverflow: document.body.scrollWidth > document.body.clientWidth + 2
                  };
                  function cleanText(value) { return String(value || '').replace(/\s+/g,' ').trim(); }
                });
                productRows.push({ route, status: response?.status() || '', source_sku: product.sku || '', displayed_sku: data.sku.join(' | '), displayed_category: /Category\s*:/i.test(data.meta.join(' ')), displayed_brand: /Brand\s*:/i.test(data.meta.join(' ')), meta_text: data.meta.join(' | '), displayed_prices: data.prices.join(' | '), description_words: data.descriptionWords, gallery_width: data.gallery?.width || '', gallery_height: data.gallery?.height || '', related_cards: data.relatedCards, broken_images: data.brokenImages, horizontal_overflow: data.horizontalOverflow });
              } catch (error) { productRows.push({ route, error: String(error) }); }
            }

            const interactions = [];
            async function test(name, fn) { try { interactions.push({ name, status: 'PASS', details: JSON.stringify(await fn() || {}) }); } catch (error) { interactions.push({ name, status: 'FAIL', details: String(error.stack || error) }); } }
            const testProduct = sourceProducts.find(product => product.is_in_stock && (product.variations || []).length === 0) || sourceProducts[0];
            const testRoute = `/products/${testProduct.slug}`;

            await test('Header Shop link', async () => { await goto('/'); const link = page.getByRole('link', { name: /^shop$/i }).first(); if (!await link.count()) throw new Error('Shop link missing'); const href = await link.getAttribute('href'); const response = await context.request.get(toOrigin(href), { failOnStatusCode: false }); if (response.status() >= 400) throw new Error(`Shop link returned ${response.status()}`); return { href, status: response.status() }; });
            await test('Search submission', async () => { await goto('/'); const input = page.locator('input[type="search"],input[name="q"],input[placeholder*="Search" i]').first(); if (!await input.count()) throw new Error('Search input missing'); await input.fill('mower'); await input.press('Enter'); await wait(800); if (!page.url().includes('/search')) throw new Error(`Unexpected URL ${page.url()}`); const cards = await page.locator('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').count(); if (!cards) throw new Error('Search results contain no cards'); return { url: page.url(), cards }; });
            await test('Product tabs', async () => { await goto(testRoute); const reviews = page.getByRole('button', { name: /reviews/i }).first(); const shipping = page.getByRole('button', { name: /shipping/i }).first(); if (!await reviews.count() || !await shipping.count()) throw new Error('Product tabs missing'); await reviews.click(); await shipping.click(); return { reviews: true, shipping: true }; });
            await test('Quantity increase', async () => { await goto(testRoute); const input = page.locator('input[name="quantity"],input[type="number"]').first(); if (!await input.count()) throw new Error('Quantity input missing'); const before = Number(await input.inputValue()); const plus = page.locator('[data-quantity-plus],button[aria-label*="increase" i],button:has-text("+")').first(); if (!await plus.count()) throw new Error('Quantity plus missing'); await plus.click(); const after = Number(await input.inputValue()); if (!(after > before)) throw new Error(`${before} -> ${after}`); return { before, after }; });
            await test('Add to Cart', async () => { await goto(testRoute); const button = page.getByRole('button', { name: /add to cart/i }).first(); if (!await button.count() || await button.isDisabled()) throw new Error('Add to Cart missing or disabled'); await button.click(); await wait(1200); await goto('/cart'); const text = clean(await page.locator('body').innerText()); if (/cart is empty|your cart is empty/i.test(text)) throw new Error('Cart remained empty'); return { cart_has_item: true }; });
            await test('Buy Now visible', async () => { await goto(testRoute); const button = page.getByRole('button', { name: /buy now/i }).first(); if (!await button.count() || await button.isDisabled()) throw new Error('Buy Now missing or disabled'); return await button.evaluate(node => ({ visible: !!(node.offsetWidth || node.offsetHeight), formAction: node.form?.action || '', type: node.type || '' })); });
            await test('Wishlist toggle', async () => { await goto(testRoute); const button = page.getByRole('button', { name: /wishlist/i }).first(); if (!await button.count()) throw new Error('Wishlist missing'); const before = await button.getAttribute('aria-pressed'); await button.click(); const after = await button.getAttribute('aria-pressed'); return { before, after }; });
            await test('Compare toggle', async () => { await goto(testRoute); const button = page.getByRole('button', { name: /compare/i }).first(); if (!await button.count()) throw new Error('Compare missing'); const before = await button.getAttribute('aria-pressed'); await button.click(); const after = await button.getAttribute('aria-pressed'); return { before, after }; });
            await test('Collection pagination', async () => { await goto('/collections/all-products'); const next = page.locator('.vd-pagination a[rel="next"],a[aria-label*="next" i],.pagination a:has-text("Next")').first(); if (!await next.count()) throw new Error('Pagination Next missing'); const href = await next.getAttribute('href'); const response = await context.request.get(toOrigin(href), { failOnStatusCode: false }); if (response.status() >= 400) throw new Error(`Next returned ${response.status()}`); return { href, status: response.status() }; });
            await test('Order Status form', async () => { await goto('/pages/order-status'); const form = page.locator('form[action*="order_verify"],form:has(input[name="order_number"])').first(); if (!await form.count()) throw new Error('Order form missing'); const email = form.locator('input[name="email"]'); const order = form.locator('input[name="order_number"]'); if (!await email.count() || !await order.count()) throw new Error('Required fields missing'); const responsePromise = page.waitForResponse(response => response.url().includes('/api/order_verify'), { timeout: 20000 }).catch(() => null); await email.fill('audit-no-order@example.com'); await order.fill('AUDIT-000000'); await form.locator('button[type="submit"],input[type="submit"]').first().click(); const response = await responsePromise; return { api_status: response?.status() || '', action: await form.getAttribute('action') }; });
            await test('Mobile menu', async () => { const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, storageState: await context.storageState(), ignoreHTTPSErrors: true }); const mp = await mobile.newPage(); await mp.goto(ORIGIN.href, { waitUntil: 'domcontentloaded', timeout: 90000 }); const trigger = mp.locator('[data-mobile-menu-trigger],button[aria-label*="menu" i],.mobile-menu-trigger').first(); if (!await trigger.count()) throw new Error('Mobile menu trigger missing'); await trigger.click(); await wait(300); const shop = mp.getByRole('link', { name: /^shop$/i }).first(); if (!await shop.count()) throw new Error('Mobile Shop link missing'); const href = await shop.getAttribute('href'); await mp.screenshot({ path: 'audit/screenshots/mobile-home.png', fullPage: true }).catch(() => {}); await mobile.close(); return { shop: href }; });

            const policyFindings = [];
            const low = Object.fromEntries(Object.entries(policyData).map(([route,data]) => [route, clean(data.text).toLowerCase()]));
            const pages = regex => Object.entries(low).filter(([,text]) => regex.test(text)).map(([route]) => route);
            const add = (severity, issue, routes, evidence) => policyFindings.push({ severity, issue, pages: [...new Set(routes)].join(' | '), evidence });
            const old = pages(/ibenry|ibenry group|ibenry\.com|contact@ibenry|1550 blairs ferry|319[\s\-.()]*305[\s\-.]*8352/i); if (old.length) add('CRITICAL','Old source identity remains',old,'Legacy brand or contact information');
            const platform = pages(/wordpress|woocommerce|shopify/i); if (platform.length) add('HIGH','Wrong platform reference',platform,'Legacy platform wording');
            const intl = pages(/international (delivery|shipping)|outside the united states|ship internationally/i), us = pages(/united states only|only ship within the united states|ship only to/i); if (intl.length && us.length) add('HIGH','Shipping destination conflict',[...intl,...us],'International and U.S.-only language coexist');
            const free = pages(/free (standard )?shipping|shipping is free/i), calculated = pages(/shipping (is|will be) calculated at checkout|calculated at checkout/i); if (free.length && calculated.length) add('HIGH','Shipping cost conflict',[...free,...calculated],'Free shipping and calculated-at-checkout language coexist');
            const unused = pages(/must be unused|unused.{0,80}original/i), used = pages(/slightly used|gently used|used products/i); if (unused.length && used.length) add('HIGH','Return condition conflict',[...unused,...used],'Unused-only and used-product returns coexist');
            const security = pages(/100% (safe|secure)|level 1 pci|pci dss|128-bit ssl|guaranteed secure/i); if (security.length) add('MEDIUM','Unsupported security/compliance claim',security,'Absolute security, PCI, or SSL claim');
            const bounty = pages(/bounty|cash reward|safe harbor/i); if (bounty.length) add('HIGH','Security bounty promise requires active program',bounty,'Bounty or safe-harbor language');
            const warranty = pages(/three-year warranty|3-year warranty/i); if (warranty.length) add('HIGH','Blanket warranty requires proof',warranty,'Three-year warranty for all products');
            for (const [route,data] of Object.entries(policyData)) {
              const text = clean(data.text).toLowerCase();
              if (['/pages/contact-us','/pages/privacy-policy','/pages/terms-of-service','/pages/shipping-policy','/pages/refund-and-returns-policy','/pages/billing-policy'].includes(route) && !text.includes('support@vardentra.com')) add('HIGH','Support email missing',[route],'support@vardentra.com');
              if (route === '/pages/contact-us' && !text.replace(/\D/g,'').includes('15125776043')) add('HIGH','Final phone missing',[route],'+1 5125776043');
              if (route === '/pages/contact-us' && !text.includes('7889 s oakleaf st')) add('HIGH','Final address missing',[route],'7889 S Oakleaf St, Bennett, CO 80102, USA');
            }

            const titleGroups = {}, descriptionGroups = {};
            for (const row of routeRows) { if (row.title) (titleGroups[row.title] ||= []).push(row.route); if (row.meta_description) (descriptionGroups[row.meta_description] ||= []).push(row.route); }
            const duplicateTitles = Object.entries(titleGroups).filter(([,routes]) => routes.length > 1);
            const duplicateDescriptions = Object.entries(descriptionGroups).filter(([,routes]) => routes.length > 1);

            const summary = {
              audited_at: new Date().toISOString(), origin: ORIGIN.href, auth_status: auth.status(), source_products: sourceProducts.length,
              core_routes_checked: routeRows.length, broken_core_routes: routeRows.filter(row => Number(row.status) >= 400 || row.error).length,
              product_routes_checked: productRouteRows.length, broken_product_routes: productRouteRows.filter(row => Number(row.status) >= 400 || row.error).length,
              internal_links_checked: linkRows.length, broken_internal_links: linkRows.filter(row => Number(row.status) >= 400 || row.error).length,
              dom_routes_checked: domRows.length, broken_displayed_images: domRows.reduce((count,row) => count + Number(row.broken_images || 0), 0), horizontal_overflow_routes: domRows.filter(row => row.horizontalOverflow).map(row => row.route),
              product_pages_sampled: productRows.length, product_missing_sku: productRows.filter(row => !row.displayed_sku).map(row => row.route), product_missing_category: productRows.filter(row => !row.displayed_category).map(row => row.route), product_missing_brand: productRows.filter(row => !row.displayed_brand).map(row => row.route), product_short_description: productRows.filter(row => Number(row.description_words) < 20).map(row => row.route), product_non_square_gallery: productRows.filter(row => row.gallery_width && Math.abs(Number(row.gallery_width)-Number(row.gallery_height)) > 8).map(row => row.route), product_missing_related: productRows.filter(row => Number(row.related_cards) === 0).map(row => row.route),
              interaction_pass: interactions.filter(row => row.status === 'PASS').length, interaction_fail: interactions.filter(row => row.status === 'FAIL').length,
              policy_findings: policyFindings.length, duplicate_titles: duplicateTitles.length, duplicate_meta_descriptions: duplicateDescriptions.length,
              console_errors: consoleErrors.length, page_errors: pageErrors.length, failed_requests: failedRequests.length
            };

            csv('audit/routes.csv', routeRows); csv('audit/product-routes.csv', productRouteRows); csv('audit/links.csv', linkRows); csv('audit/dom.csv', domRows); csv('audit/products-sample.csv', productRows); csv('audit/interactions.csv', interactions); csv('audit/policy-findings.csv', policyFindings);
            fs.writeFileSync('audit/policies.json', JSON.stringify(policyData,null,2));
            fs.writeFileSync('audit/results.json', JSON.stringify({ summary, routeRows, productRouteRows, linkRows, domRows, productRows, interactions, policyFindings, duplicateTitles, duplicateDescriptions, consoleErrors, pageErrors, failedRequests }, null, 2));
