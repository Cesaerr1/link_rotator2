name: Vardentra comprehensive storefront audit 2026-08-09

on:
  push:
    branches:
      - agent/vardentra-live-audit-20260809
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install audit dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 cheerio@1.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit Vardentra storefront
        env:
          STORE_URL: https://www.vardentra.com/
          VIEWER_PASSWORD: '123456'
        shell: bash
        run: |
          mkdir -p audit/screenshots audit/html audit/policies
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');
          const path = require('path');

          const BASE = new URL(process.env.STORE_URL);
          const PASSWORD = process.env.VIEWER_PASSWORD;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
          const safeName = value => value === '/' ? 'home' : value.replace(/^\//,'').replace(/[?&#=/]+/g,'-').replace(/-+$/,'').slice(0,160) || 'route';
          const normalize = href => {
            try {
              const url = new URL(href, BASE);
              url.hash = '';
              url.searchParams.delete('spm');
              url.searchParams.delete('spm_prev');
              return url.href;
            } catch { return ''; }
          };
          const isInternal = href => {
            try {
              const host = new URL(href, BASE).hostname.replace(/^www\./,'');
              return host === BASE.hostname.replace(/^www\./,'');
            } catch { return false; }
          };
          const csvCell = value => {
            const text = typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
            return /[",\n]/.test(text) ? `"${text.replace(/"/g,'""')}"` : text;
          };
          const writeCsv = (filename, rows) => {
            if (!rows.length) { fs.writeFileSync(filename, ''); return; }
            const headers = [...new Set(rows.flatMap(r => Object.keys(r)))];
            const lines = [headers.map(csvCell).join(',')];
            for (const row of rows) lines.push(headers.map(h => csvCell(row[h])).join(','));
            fs.writeFileSync(filename, lines.join('\n') + '\n');
          };

          const coreRoutes = [
            '/',
            '/collections/all-products','/collections/car-lift','/collections/cardio-machines','/collections/electric-bicycles',
            '/collections/fishing-kayaks','/collections/garden-essentials','/collections/gazebo-pergolas','/collections/handy-mowers',
            '/collections/home-finds','/collections/portable-generators','/collections/ride-mowers','/collections/sheds',
            '/collections/swing-sets','/collections/trampoline',
            '/pages/about-us','/pages/contact-us','/pages/faqs','/pages/order-status','/pages/shipping-policy',
            '/pages/refund-and-returns-policy','/pages/privacy-policy','/pages/terms-of-service','/pages/billing-policy',
            '/pages/cookie-policy','/pages/wishlist','/pages/compare',
            '/cart','/search?q=mower','/account','/account/login','/account/register','/account/forgot-password',
            '/order-verify','/account/order_lookup',
            '/pages/billing-terms','/pages/warranty-policy','/pages/wholesale-policy','/pages/security-reporting'
          ];
          const policyRoutes = [
            '/pages/about-us','/pages/contact-us','/pages/faqs','/pages/order-status','/pages/shipping-policy',
            '/pages/refund-and-returns-policy','/pages/privacy-policy','/pages/terms-of-service',
            '/pages/billing-policy','/pages/cookie-policy','/pages/billing-terms','/pages/warranty-policy',
            '/pages/wholesale-policy','/pages/security-reporting'
          ];
          const sourcePolicyRoutes = {
            'shipping-policy':'https://ibenry.com/shipping-policy/',
            'refund-and-returns-policy':'https://ibenry.com/refund-and-returns-policy/',
            'privacy-policy':'https://ibenry.com/privacy-policy/',
            'terms-of-service':'https://ibenry.com/terms-of-service/',
            'billing-policy':'https://ibenry.com/billing-policy/',
            'billing-terms':'https://ibenry.com/billing-term-and-condition/',
            'warranty-policy':'https://ibenry.com/warranty-replacement/',
            'wholesale-policy':'https://ibenry.com/wholesale-policies/',
            'security-reporting':'https://ibenry.com/report-security-issues/',
            'faqs':'https://ibenry.com/faqs/',
            'about-us':'https://ibenry.com/about-us/',
            'contact-us':'https://ibenry.com/contact-us/'
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1050 },
              ignoreHTTPSErrors: true,
              locale: 'en-US'
            });

            const auth = await context.request.post(new URL('/api/password/v2', BASE).href, {
              form: { password: PASSWORD }, failOnStatusCode: false, maxRedirects: 10, timeout: 60000
            });

            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push({ page: page.url(), text: message.text() });
            });
            page.on('pageerror', error => pageErrors.push({ page: page.url(), text: String(error.stack || error) }));
            page.on('requestfailed', request => failedRequests.push({ page: page.url(), url: request.url(), reason: request.failure()?.errorText || '' }));

            // Discover catalogue products through all collection routes and the native search endpoint.
            const productMap = new Map();
            const searchTerms = ['', 'mower', 'kayak', 'lift', 'bike', 'bicycle', 'generator', 'shed', 'swing', 'trampoline', 'gazebo', 'cardio', 'garden', 'home', 'portable', 'zero turn'];
            for (const keyword of searchTerms) {
              for (let requestedPage = 0; requestedPage < 20; requestedPage++) {
                try {
                  const response = await context.request.get(new URL('/api/search', BASE).href, {
                    params: { keyword, page: requestedPage, limit: 100 }, timeout: 60000, failOnStatusCode: false
                  });
                  if (response.status() >= 400) break;
                  const payload = await response.json().catch(() => null);
                  const products = payload?.data?.products || [];
                  for (const product of products) {
                    if (product.handle) productMap.set(product.handle, product);
                  }
                  if (!products.length || !payload?.data?.has_more) break;
                } catch { break; }
              }
            }

            for (const route of coreRoutes.filter(r => r.startsWith('/collections/'))) {
              try {
                await page.goto(new URL(route, BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
                await page.waitForLoadState('networkidle', { timeout: 25000 }).catch(() => {});
                for (const href of await page.locator('a[href*="/products/"]').evaluateAll(nodes => nodes.map(n => n.href))) {
                  const match = new URL(href).pathname.match(/^\/products\/([^/?#]+)/);
                  if (match && !productMap.has(match[1])) productMap.set(match[1], { handle: match[1], url: href });
                }
              } catch {}
            }

            const allProducts = [...productMap.values()].sort((a,b) => String(a.handle).localeCompare(String(b.handle)));
            const productRoutes = allProducts.map(product => `/products/${product.handle}`);
            const sampleSize = Math.min(64, productRoutes.length);
            const productSampleRoutes = [];
            if (productRoutes.length) {
              for (let index = 0; index < sampleSize; index++) {
                productSampleRoutes.push(productRoutes[Math.floor(index * productRoutes.length / sampleSize)]);
              }
            }

            const routeRows = [];
            const buttonRows = [];
            const formRows = [];
            const productRows = [];
            const policyData = {};
            const discoveredInternalLinks = new Set();

            async function inspectRoute(route, options = {}) {
              let response = null;
              let navigationError = '';
              try {
                response = await page.goto(new URL(route, BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
                await page.waitForLoadState('networkidle', { timeout: 25000 }).catch(() => {});
                await sleep(options.longWait ? 3500 : 900);
              } catch (error) { navigationError = String(error); }

              const result = await page.evaluate(() => {
                const main = document.querySelector('main,#MainContent,[role="main"]') || document.body;
                const visible = element => !!(element.offsetWidth || element.offsetHeight || element.getClientRects().length);
                const images = [...document.images].map(img => ({
                  src: img.currentSrc || img.src, alt: img.alt || '', displayed: visible(img), complete: img.complete,
                  naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight
                }));
                const links = [...document.querySelectorAll('a[href]')].map(a => ({
                  text: (a.innerText || a.getAttribute('aria-label') || '').replace(/\s+/g,' ').trim(), href: a.href,
                  displayed: visible(a), className: a.className || ''
                }));
                const buttons = [...document.querySelectorAll('button,input[type="submit"],input[type="button"],a[role="button"],.button,.btn')].map((button, index) => ({
                  index, tag: button.tagName, text: (button.innerText || button.value || button.getAttribute('aria-label') || '').replace(/\s+/g,' ').trim(),
                  displayed: visible(button), disabled: !!button.disabled || button.getAttribute('aria-disabled') === 'true',
                  type: button.getAttribute('type') || '', href: button.href || '', id: button.id || '', className: String(button.className || ''),
                  formAction: button.form?.action || '', formMethod: button.form?.method || '', onclick: button.getAttribute('onclick') || ''
                }));
                const forms = [...document.forms].map((form, index) => ({
                  index, action: form.action, method: form.method, id: form.id || '', className: String(form.className || ''),
                  inputs: [...form.elements].map(element => ({ name: element.name, type: element.type, required: !!element.required, value: element.type === 'hidden' ? element.value : '' })).filter(item => item.name)
                }));
                const productMeta = [...document.querySelectorAll('.vd-product-identity li,.vd-product-taxonomy li,.product-meta li,[data-product-meta]')].map(node => (node.innerText || '').replace(/\s+/g,' ').trim());
                const desc = document.querySelector('[data-tab-panel="description"],.vd-product-description,.product-description,.rte');
                const gallery = document.querySelector('.vd-product-gallery,.product-gallery,[data-product-gallery]');
                const stage = gallery?.querySelector('.vd-product-stage,.product-main-image,[data-product-stage]');
                return {
                  url: location.href, title: document.title, h1: document.querySelector('h1')?.innerText?.trim() || '',
                  metaDescription: document.querySelector('meta[name="description"]')?.content || '',
                  canonical: document.querySelector('link[rel="canonical"]')?.href || '', lang: document.documentElement.lang || '',
                  mainText: (main.innerText || '').replace(/\s+/g,' ').trim(), bodyText: (document.body.innerText || '').replace(/\s+/g,' ').trim(),
                  links, buttons, forms, productMeta, images,
                  brokenImages: images.filter(image => image.displayed && (!image.complete || !image.naturalWidth)),
                  emptyLinks: links.filter(link => !link.href || link.href.endsWith('#') || link.href.startsWith('javascript:')),
                  h1Count: document.querySelectorAll('h1').length,
                  productCards: document.querySelectorAll('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').length,
                  skuText: [...document.querySelectorAll('[data-sku-value],[data-product-sku],.vd-product-sku,.sku')].map(node => (node.innerText || '').trim()).filter(Boolean),
                  priceText: [...document.querySelectorAll('.vd-product-price,.price,[data-product-price],.money')].map(node => (node.innerText || '').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,8),
                  descriptionText: (desc?.innerText || '').replace(/\s+/g,' ').trim(), descriptionHTML: (desc?.innerHTML || '').slice(0,10000),
                  galleryAspect: stage ? { width: stage.getBoundingClientRect().width, height: stage.getBoundingClientRect().height } : null,
                  thumbnailCount: gallery ? gallery.querySelectorAll('img').length : 0,
                  relatedCards: document.querySelectorAll('[data-related-grid] [data-product-card],.vd-related [data-product-card],.related-products [data-product-card],.related-products .shoplazza-product-snippet').length,
                  overflow: { bodyScrollWidth: document.body.scrollWidth, bodyClientWidth: document.body.clientWidth, htmlScrollWidth: document.documentElement.scrollWidth, htmlClientWidth: document.documentElement.clientWidth }
                };
              }).catch(error => ({ evaluationError: String(error) }));

              for (const link of result.links || []) if (isInternal(link.href)) discoveredInternalLinks.add(normalize(link.href));
              for (const button of result.buttons || []) buttonRows.push({ route, ...button });
              for (const form of result.forms || []) formRows.push({ route, ...form, inputs: JSON.stringify(form.inputs) });

              const row = {
                route, status: response?.status() || '', final_url: result.url || page.url(), navigation_error: navigationError,
                title: result.title || '', h1: result.h1 || '', h1_count: result.h1Count ?? '', meta_description: result.metaDescription || '', canonical: result.canonical || '',
                main_text_length: (result.mainText || '').length, product_cards: result.productCards ?? '', broken_images: (result.brokenImages || []).length,
                empty_links: (result.emptyLinks || []).length, horizontal_overflow: !!(result.overflow && result.overflow.bodyScrollWidth > result.overflow.bodyClientWidth + 2)
              };
              routeRows.push(row);

              if (options.saveHtml) fs.writeFileSync(path.join('audit/html', `${safeName(route)}.html`), await page.content());
              if (options.screenshot) await page.screenshot({ path: path.join('audit/screenshots', `${safeName(route)}.png`), fullPage: true }).catch(() => {});

              if (route.startsWith('/products/')) {
                const metaText = (result.productMeta || []).join(' ');
                const product = productMap.get(route.split('/').pop()) || {};
                productRows.push({
                  route, status: response?.status() || '', title: result.h1 || result.title || '', api_title: product.title || '',
                  displayed_sku: (result.skuText || []).join(' | '), api_sku: product.sku || '',
                  displayed_category: /Category\s*:/i.test(metaText), displayed_brand: /Brand\s*:/i.test(metaText), meta_text: metaText,
                  displayed_prices: (result.priceText || []).join(' | '), api_price: product.price ?? '', api_compare_at_price: product.compare_at_price ?? '',
                  description_words: (result.descriptionText || '').split(/\s+/).filter(Boolean).length,
                  description_starts: (result.descriptionText || '').slice(0,240), thumbnail_count: result.thumbnailCount ?? '',
                  gallery_width: result.galleryAspect?.width ?? '', gallery_height: result.galleryAspect?.height ?? '',
                  related_cards: result.relatedCards ?? '', broken_images: (result.brokenImages || []).length,
                  horizontal_overflow: !!(result.overflow && result.overflow.bodyScrollWidth > result.overflow.bodyClientWidth + 2)
                });
              }

              if (policyRoutes.includes(route)) {
                policyData[route] = {
                  status: response?.status() || '', finalUrl: result.url || '', title: result.title || '', h1: result.h1 || '',
                  text: result.mainText || '', html: (await page.content()).slice(0,500000)
                };
                fs.writeFileSync(path.join('audit/policies', `${safeName(route)}.txt`), result.mainText || '');
              }

              return { response, result };
            }

            for (const route of coreRoutes) {
              await inspectRoute(route, {
                longWait: route === '/', saveHtml: policyRoutes.includes(route) || route === '/' || route.includes('order'),
                screenshot: ['/', '/pages/order-status', '/cart', '/search?q=mower'].includes(route)
              });
            }
            for (const route of productSampleRoutes) await inspectRoute(route, { saveHtml: productRows.length < 4, screenshot: productRows.length < 2 });

            // Check all discovered product routes by HTTP, even when only a representative subset is rendered in a browser.
            const allProductRouteChecks = [];
            const concurrency = 12;
            let cursor = 0;
            async function productWorker() {
              while (cursor < productRoutes.length) {
                const index = cursor++;
                const route = productRoutes[index];
                try {
                  const response = await context.request.get(new URL(route, BASE).href, { timeout: 45000, failOnStatusCode: false, maxRedirects: 8 });
                  const text = await response.text();
                  allProductRouteChecks.push({ route, status: response.status(), final_url: response.url(), html_length: text.length, has_add_to_cart: /add to cart/i.test(text), has_product_title: /<h1/i.test(text) });
                } catch (error) { allProductRouteChecks.push({ route, error: String(error) }); }
              }
            }
            await Promise.all(Array.from({ length: concurrency }, () => productWorker()));

            // Link crawl: status-check every unique internal link collected from the audited pages.
            const linkRows = [];
            const links = [...discoveredInternalLinks].filter(Boolean).slice(0, 2500);
            let linkCursor = 0;
            async function linkWorker() {
              while (linkCursor < links.length) {
                const href = links[linkCursor++];
                try {
                  const response = await context.request.get(href, { timeout: 30000, failOnStatusCode: false, maxRedirects: 10 });
                  linkRows.push({ href, status: response.status(), final_url: response.url(), content_type: response.headers()['content-type'] || '' });
                } catch (error) { linkRows.push({ href, error: String(error) }); }
              }
            }
            await Promise.all(Array.from({ length: 15 }, () => linkWorker()));

            // Safe interaction tests. No order, review, contact message, or payment is submitted.
            const interactions = [];
            async function interaction(name, fn) {
              try { const details = await fn(); interactions.push({ name, status: 'PASS', details: typeof details === 'string' ? details : JSON.stringify(details || {}) }); }
              catch (error) { interactions.push({ name, status: 'FAIL', details: String(error.stack || error) }); }
            }

            await interaction('Header Shop link', async () => {
              await page.goto(BASE.href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const link = page.getByRole('link', { name: /^shop$/i }).first();
              if (!await link.count()) throw new Error('Shop link not found');
              await Promise.all([page.waitForLoadState('domcontentloaded'), link.click()]);
              if (!page.url().includes('/collections/')) throw new Error(`Unexpected destination ${page.url()}`);
              return page.url();
            });

            await interaction('Search submission', async () => {
              await page.goto(BASE.href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const input = page.locator('input[type="search"],input[name="q"],input[placeholder*="Search" i]').first();
              if (!await input.count()) throw new Error('Search input not found');
              await input.fill('mower');
              await input.press('Enter');
              await page.waitForLoadState('domcontentloaded', { timeout: 60000 }).catch(() => {});
              await sleep(1200);
              if (!page.url().includes('/search')) throw new Error(`Search did not reach results route: ${page.url()}`);
              const cards = await page.locator('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').count();
              if (!cards) throw new Error('Search results contain no product cards');
              return { url: page.url(), cards };
            });

            const interactionProduct = allProducts.find(product => product.available !== false && (product.variants || []).length <= 1) || allProducts[0];
            const interactionProductUrl = new URL(`/products/${interactionProduct?.handle || ''}`, BASE).href;

            await interaction('Product gallery controls', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForLoadState('networkidle', { timeout: 25000 }).catch(() => {});
              const main = page.locator('[data-product-main-image],.vd-product-stage img,.product-main-image img').first();
              const before = await main.getAttribute('src').catch(() => '');
              const next = page.locator('[data-gallery-next],.vd-gallery-next,button[aria-label*="next" i]').first();
              if (await next.count()) {
                await next.click(); await sleep(500);
                const after = await main.getAttribute('src').catch(() => '');
                return { next_present: true, image_changed: before !== after };
              }
              const thumbs = page.locator('.vd-product-thumbnails button,.vd-product-thumbnails img,[data-thumbnail]');
              if (await thumbs.count() > 1) {
                await thumbs.nth(1).click(); await sleep(500);
                const after = await main.getAttribute('src').catch(() => '');
                return { thumbnail_present: true, image_changed: before !== after };
              }
              return { single_image_product: true };
            });

            await interaction('Product tabs', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const reviewTab = page.getByRole('button', { name: /reviews/i }).first();
              if (!await reviewTab.count()) throw new Error('Reviews tab not found');
              await reviewTab.click(); await sleep(300);
              const active = await reviewTab.getAttribute('aria-selected');
              const shippingTab = page.getByRole('button', { name: /shipping/i }).first();
              if (!await shippingTab.count()) throw new Error('Shipping tab not found');
              await shippingTab.click(); await sleep(300);
              return { reviews_selected: active, shipping_clicked: true };
            });

            await interaction('Quantity controls', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const qty = page.locator('input[name="quantity"],input[type="number"]').first();
              if (!await qty.count()) throw new Error('Quantity input not found');
              const initial = Number(await qty.inputValue());
              const plus = page.locator('[data-quantity-plus],button[aria-label*="increase" i],button:has-text("+")').first();
              if (!await plus.count()) throw new Error('Quantity increase control not found');
              await plus.click(); await sleep(250);
              const after = Number(await qty.inputValue());
              if (!(after > initial)) throw new Error(`Quantity did not increase (${initial} -> ${after})`);
              return { initial, after };
            });

            await interaction('Add to Cart and remove', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const add = page.getByRole('button', { name: /add to cart/i }).first();
              if (!await add.count()) throw new Error('Add to Cart button not found');
              if (await add.isDisabled()) throw new Error('Add to Cart button is disabled');
              await add.click(); await sleep(1800);
              await page.goto(new URL('/cart', BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await sleep(800);
              const cartText = clean(await page.locator('main,body').first().innerText());
              const itemPresent = cartText.toLowerCase().includes(clean(interactionProduct.title || '').toLowerCase().slice(0,20)) || !/your cart is empty|cart is empty/i.test(cartText);
              if (!itemPresent) throw new Error('Cart did not contain the added product');
              const remove = page.locator('[data-cart-remove],button[aria-label*="remove" i],a[aria-label*="remove" i],button:has-text("Remove"),a:has-text("Remove")').first();
              if (await remove.count()) { await remove.click(); await sleep(1200); }
              return { added: true, remove_control_found: !!(await remove.count()) };
            });

            await interaction('Buy Now control', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const buy = page.getByRole('button', { name: /buy now/i }).first();
              if (!await buy.count()) throw new Error('Buy Now button not found');
              if (await buy.isDisabled()) throw new Error('Buy Now button is disabled');
              const form = await buy.evaluate(button => ({ action: button.form?.action || '', method: button.form?.method || '', type: button.type || '' }));
              return { visible: await buy.isVisible(), ...form };
            });

            await interaction('Wishlist toggle', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const button = page.getByRole('button', { name: /wishlist/i }).first();
              if (!await button.count()) throw new Error('Wishlist button not found');
              const before = await button.getAttribute('aria-pressed');
              await button.click(); await sleep(400);
              const after = await button.getAttribute('aria-pressed');
              return { before, after, text: clean(await button.innerText()) };
            });

            await interaction('Compare toggle', async () => {
              await page.goto(interactionProductUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const button = page.getByRole('button', { name: /compare/i }).first();
              if (!await button.count()) throw new Error('Compare button not found');
              const before = await button.getAttribute('aria-pressed');
              await button.click(); await sleep(400);
              const after = await button.getAttribute('aria-pressed');
              return { before, after, text: clean(await button.innerText()) };
            });

            await interaction('Collection pagination', async () => {
              await page.goto(new URL('/collections/all-products', BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const next = page.locator('.vd-pagination a[rel="next"],a[aria-label*="next" i],.pagination a:has-text("Next")').first();
              if (!await next.count()) throw new Error('Next pagination link not found');
              const href = await next.getAttribute('href');
              const response = await context.request.get(new URL(href, BASE).href, { failOnStatusCode: false, timeout: 45000 });
              if (response.status() >= 400) throw new Error(`Next page returned ${response.status()}`);
              return { href, status: response.status() };
            });

            await interaction('Order Status invalid lookup response', async () => {
              await page.goto(new URL('/pages/order-status', BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const form = page.locator('form[action*="order_verify"],form:has(input[name="order_number"])').first();
              if (!await form.count()) throw new Error('Order verification form not found');
              await form.locator('input[name="email"]').fill('audit-no-order@example.com');
              await form.locator('input[name="order_number"]').fill('AUDIT-000000');
              const responsePromise = page.waitForResponse(response => response.url().includes('/api/order_verify'), { timeout: 30000 }).catch(() => null);
              await form.locator('button[type="submit"],input[type="submit"]').first().click();
              const response = await responsePromise;
              await sleep(700);
              const visibleText = clean(await form.locator('xpath=..').innerText().catch(() => ''));
              return { api_status: response?.status() || '', error_feedback_visible: /invalid|not found|incorrect|unable|order/i.test(visibleText), text: visibleText.slice(0,300) };
            });

            // Mobile interaction tests.
            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, storageState: await context.storageState(), ignoreHTTPSErrors: true });
            const mobilePage = await mobile.newPage();
            await interaction('Mobile menu open and navigate', async () => {
              await mobilePage.goto(BASE.href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              const trigger = mobilePage.locator('[data-mobile-menu-trigger],button[aria-label*="menu" i],.mobile-menu-trigger').first();
              if (!await trigger.count()) throw new Error('Mobile menu trigger not found');
              await trigger.click(); await sleep(350);
              const drawer = mobilePage.locator('[data-mobile-menu],.vd-mobile-drawer,.mobile-drawer,[role="dialog"]').filter({ visible: true }).first();
              const visibleDrawer = await drawer.count() ? await drawer.isVisible() : false;
              const shopLink = mobilePage.getByRole('link', { name: /^shop$/i }).first();
              if (!await shopLink.count()) throw new Error('Shop link not present in mobile menu');
              return { drawer_visible: visibleDrawer, shop_link: await shopLink.getAttribute('href') };
            });
            for (const route of ['/', '/collections/all-products', interactionProduct ? `/products/${interactionProduct.handle}` : '/products/']) {
              await mobilePage.goto(new URL(route, BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(() => {});
              await sleep(1000);
              await mobilePage.screenshot({ path: path.join('audit/screenshots', `mobile-${safeName(route)}.png`), fullPage: true }).catch(() => {});
            }
            await mobile.close();

            // Source policy extraction for clause-preservation comparison.
            const sourcePolicies = {};
            for (const [handle, url] of Object.entries(sourcePolicyRoutes)) {
              try {
                const response = await context.request.get(url, { timeout: 60000, failOnStatusCode: false });
                const html = await response.text();
                const $ = cheerio.load(html);
                $('script,style,nav,header,footer,form').remove();
                const text = clean($('main,.entry-content,.page-content,article,body').first().text());
                sourcePolicies[handle] = { status: response.status(), url: response.url(), text, htmlLength: html.length };
                fs.writeFileSync(path.join('audit/policies', `source-${handle}.txt`), text);
              } catch (error) { sourcePolicies[handle] = { error: String(error) }; }
            }

            // Policy conflict heuristics. This does not replace legal review; it highlights contradictions and unsupported legacy language.
            const allPolicyText = Object.fromEntries(Object.entries(policyData).map(([route, data]) => [route, clean(data.text).toLowerCase()]));
            const policyFindings = [];
            const findPages = regex => Object.entries(allPolicyText).filter(([, text]) => regex.test(text)).map(([route]) => route);
            const addFinding = (severity, issue, pages, evidence) => policyFindings.push({ severity, issue, pages: pages.join(' | '), evidence });
            const oldIdentityPages = findPages(/ibenry|ibenry group|ibenry\.com|contact@ibenry|1550 blairs ferry|319[\s\-.()]*305[\s\-.]*8352/i);
            if (oldIdentityPages.length) addFinding('CRITICAL', 'Old source identity remains', oldIdentityPages, 'Ibenry/source contact reference detected');
            const platformPages = findPages(/wordpress|woocommerce|shopify/i);
            if (platformPages.length) addFinding('HIGH', 'Legacy or wrong platform reference', platformPages, 'WordPress, WooCommerce, or Shopify wording detected');
            const intlPages = findPages(/international (delivery|shipping)|ship internationally|outside the united states/i);
            const usOnlyPages = findPages(/united states only|only (ship|shipping) within the united states|ship only to/i);
            if (intlPages.length && usOnlyPages.length) addFinding('HIGH', 'Shipping destination conflict', [...new Set([...intlPages,...usOnlyPages])], 'International-shipping wording conflicts with U.S.-only wording');
            const freePages = findPages(/free (standard )?shipping|shipping is free/i);
            const calculatedPages = findPages(/shipping (is|will be) calculated at checkout|calculated at checkout/i);
            if (freePages.length && calculatedPages.length) addFinding('HIGH', 'Shipping-cost conflict', [...new Set([...freePages,...calculatedPages])], 'Free shipping conflicts with calculated-at-checkout wording');
            const unusedPages = findPages(/unused.{0,80}original (condition|packaging)|must be unused/i);
            const usedPages = findPages(/slightly used|gently used|used products/i);
            if (unusedPages.length && usedPages.length) addFinding('HIGH', 'Return-condition conflict', [...new Set([...unusedPages,...usedPages])], 'Unused-only wording conflicts with slightly/gently used returns');
            const securityPages = findPages(/100% (safe|secure)|level 1 pci|pci dss|128-bit ssl|guaranteed secure/i);
            if (securityPages.length) addFinding('MEDIUM', 'Unsupported absolute security/compliance claim requires verification', securityPages, 'Absolute security, PCI, or SSL representation detected');
            const guaranteePages = findPages(/guaranteed delivery|delivery guarantee|lowest price guarantee/i);
            if (guaranteePages.length) addFinding('MEDIUM', 'Guarantee claim requires operational proof', guaranteePages, 'Delivery or price guarantee detected');
            const bountyPages = findPages(/bounty|reward.{0,50}\$|cash reward|safe harbor/i);
            if (bountyPages.length) addFinding('HIGH', 'Security bounty/safe-harbor promise requires an active program', bountyPages, 'Bounty, reward, or safe-harbor wording detected');
            const charityPages = findPages(/charit|donat|community impact/i);
            if (charityPages.length) addFinding('MEDIUM', 'Community/charity claim requires evidence', charityPages, 'Charity or donation claim detected');

            // Contact consistency.
            const expected = { email: 'support@vardentra.com', phoneDigits: '15125776043', addressNeedle: '7889 s oakleaf st' };
            for (const [route, data] of Object.entries(policyData)) {
              const text = clean(data.text).toLowerCase();
              if (['/pages/contact-us','/pages/privacy-policy','/pages/terms-of-service','/pages/shipping-policy','/pages/refund-and-returns-policy','/pages/billing-policy'].includes(route)) {
                if (!text.includes(expected.email)) addFinding('HIGH', 'Required support email missing', [route], expected.email);
              }
              const digits = text.replace(/\D/g,'');
              if (route === '/pages/contact-us' && !digits.includes(expected.phoneDigits)) addFinding('HIGH', 'Final telephone missing from Contact page', [route], '+1 5125776043');
              if (route === '/pages/contact-us' && !text.includes(expected.addressNeedle)) addFinding('HIGH', 'Final address missing from Contact page', [route], '7889 S Oakleaf St, Bennett, CO 80102, USA');
            }

            // SEO duplicate checks over audited HTML routes.
            const duplicateTitles = Object.entries(routeRows.reduce((acc, row) => { if (row.title) (acc[row.title] ||= []).push(row.route); return acc; }, {})).filter(([, routes]) => routes.length > 1);
            const duplicateDescriptions = Object.entries(routeRows.reduce((acc, row) => { if (row.meta_description) (acc[row.meta_description] ||= []).push(row.route); return acc; }, {})).filter(([, routes]) => routes.length > 1);

            const summary = {
              audited_at: new Date().toISOString(), base: BASE.href, password_auth_status: auth.status(),
              products_discovered: allProducts.length, product_pages_sampled_in_browser: productRows.length, product_routes_http_checked: allProductRouteChecks.length,
              routes_audited_in_browser: routeRows.length, internal_links_checked: linkRows.length,
              broken_internal_links: linkRows.filter(row => Number(row.status) >= 400 || row.error).length,
              product_route_errors: allProductRouteChecks.filter(row => Number(row.status) >= 400 || row.error).length,
              broken_displayed_images: routeRows.reduce((count, row) => count + Number(row.broken_images || 0), 0),
              routes_with_horizontal_overflow: routeRows.filter(row => row.horizontal_overflow).map(row => row.route),
              routes_with_empty_links: routeRows.filter(row => Number(row.empty_links) > 0).map(row => row.route),
              sampled_products_missing_sku_display: productRows.filter(row => !row.displayed_sku).map(row => row.route),
              sampled_products_missing_category_display: productRows.filter(row => !row.displayed_category).map(row => row.route),
              sampled_products_missing_brand_display: productRows.filter(row => !row.displayed_brand).map(row => row.route),
              sampled_products_short_descriptions: productRows.filter(row => Number(row.description_words) < 20).map(row => row.route),
              sampled_products_non_square_gallery: productRows.filter(row => row.gallery_width && Math.abs(Number(row.gallery_width) - Number(row.gallery_height)) > 8).map(row => row.route),
              sampled_products_without_related_products: productRows.filter(row => Number(row.related_cards) === 0).map(row => row.route),
              button_interactions_passed: interactions.filter(row => row.status === 'PASS').length,
              button_interactions_failed: interactions.filter(row => row.status === 'FAIL').length,
              policy_findings: policyFindings.length,
              duplicate_titles: duplicateTitles.length, duplicate_meta_descriptions: duplicateDescriptions.length,
              console_errors: consoleErrors.length, page_errors: pageErrors.length, failed_requests: failedRequests.length
            };

            writeCsv('audit/routes.csv', routeRows);
            writeCsv('audit/links.csv', linkRows);
            writeCsv('audit/buttons.csv', buttonRows);
            writeCsv('audit/forms.csv', formRows);
            writeCsv('audit/products.csv', productRows);
            writeCsv('audit/all-product-routes.csv', allProductRouteChecks);
            writeCsv('audit/interactions.csv', interactions);
            writeCsv('audit/policy-findings.csv', policyFindings);
            fs.writeFileSync('audit/policies.json', JSON.stringify({ target: policyData, source: sourcePolicies }, null, 2));
            fs.writeFileSync('audit/results.json', JSON.stringify({ summary, routeRows, linkRows, buttonRows, formRows, productRows, allProductRouteChecks, interactions, policyFindings, duplicateTitles, duplicateDescriptions, consoleErrors, pageErrors, failedRequests }, null, 2));

            const report = [
              '# Vardentra comprehensive storefront audit', '',
              `**Audited:** ${summary.audited_at}`, `**Store:** ${BASE.href}`, '',
              '## Coverage', '',
              `- Products discovered: **${summary.products_discovered}**`,
              `- Product routes HTTP-checked: **${summary.product_routes_http_checked}**`,
              `- Product pages browser-sampled: **${summary.product_pages_sampled_in_browser}**`,
              `- Routes browser-audited: **${summary.routes_audited_in_browser}**`,
              `- Internal links checked: **${summary.internal_links_checked}**`,
              `- Safe interaction tests: **${interactions.length}**`, '',
              '## Results', '',
              `- Broken internal links: **${summary.broken_internal_links}**`,
              `- Product route errors: **${summary.product_route_errors}**`,
              `- Broken displayed images: **${summary.broken_displayed_images}**`,
              `- Routes with horizontal overflow: **${summary.routes_with_horizontal_overflow.length}**`,
              `- Button tests passed: **${summary.button_interactions_passed}**`,
              `- Button tests failed: **${summary.button_interactions_failed}**`,
              `- Policy/conflict findings: **${summary.policy_findings}**`,
              `- Duplicate audited titles: **${summary.duplicate_titles}**`,
              `- Duplicate audited meta descriptions: **${summary.duplicate_meta_descriptions}**`, '',
              '## Product sample', '',
              `- Missing visible SKU: **${summary.sampled_products_missing_sku_display.length}**`,
              `- Missing visible Category: **${summary.sampled_products_missing_category_display.length}**`,
              `- Missing visible Brand: **${summary.sampled_products_missing_brand_display.length}**`,
              `- Short/empty descriptions: **${summary.sampled_products_short_descriptions.length}**`,
              `- Non-square product gallery: **${summary.sampled_products_non_square_gallery.length}**`,
              `- Missing Related Products: **${summary.sampled_products_without_related_products.length}**`, '',
              '## Interaction tests', '',
              ...interactions.map(row => `- **${row.name}: ${row.status}** — ${row.details}`), '',
              '## Policy findings', '',
              ...(policyFindings.length ? policyFindings.map(row => `- **${row.severity}: ${row.issue}** — ${row.pages} — ${row.evidence}`) : ['- No heuristic conflict was detected. Manual legal review is still required before relying on this result.']), '',
              '## Completion boundary', '',
              'The audit used non-destructive browser and HTTP checks. It did not place an order, submit a review, send a contact form, complete checkout, or modify Shoplazza admin data.'
            ].join('\n');
            fs.writeFileSync('audit/AUDIT_REPORT.md', report + '\n');

            await context.close();
            await browser.close();
          })().catch(error => {
            fs.mkdirSync('audit', { recursive: true });
            fs.writeFileSync('audit/FATAL.txt', String(error.stack || error));
            process.exitCode = 1;
          });
          JS
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vardentra-comprehensive-audit-20260809
          path: audit/
          retention-days: 1
          compression-level: 6
