name: Vardentra fresh source catalogue 2026-08-09

on:
  push:
    branches:
      - agent/vardentra-live-audit-20260809
  workflow_dispatch:

jobs:
  source-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Fetch fresh public Ibenry catalogue
        shell: bash
        run: |
          mkdir -p source
          cat > source/fetch_source.py <<'PY'
          from __future__ import annotations
          import json, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          BASE='https://ibenry.com'
          OUT=Path('source')
          s=requests.Session()
          retry=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.7,status_forcelist=(429,500,502,503,504),allowed_methods=frozenset({'GET'}),respect_retry_after_header=True)
          s.mount('https://',HTTPAdapter(max_retries=retry,pool_connections=32,pool_maxsize=32))
          s.headers.update({'User-Agent':'VardentraMigrationAudit/2.0 (owner-authorized catalogue rebuild)','Accept':'application/json,text/html,*/*'})

          def paged(url):
              rows=[]; page=1
              while True:
                  r=s.get(url,params={'per_page':100,'page':page},timeout=90); r.raise_for_status(); data=r.json()
                  if not isinstance(data,list): raise RuntimeError(f'Expected list from {r.url}')
                  rows.extend(data)
                  total=int(r.headers.get('X-WP-TotalPages',page))
                  if page>=total or not data: break
                  page+=1
              return rows

          store=paged(BASE+'/wp-json/wc/store/v1/products')
          wp=paged(BASE+'/wp-json/wp/v2/product')
          wp_by_id={int(x['id']):x for x in wp}

          def parse_page(product):
              url=product.get('permalink') or f"{BASE}/product/{product.get('slug')}/"
              out={'product_id':product.get('id'),'url':url,'status':0,'page_description_html':'','jsonld_brand':'','variations':[],'error':''}
              try:
                  r=s.get(url,timeout=90); out['status']=r.status_code; r.raise_for_status(); soup=BeautifulSoup(r.text,'lxml')
                  # Product description tabs, excluding review/related content.
                  desc=soup.select_one('#tab-description,.woocommerce-Tabs-panel--description,[data-tab-panel="description"],.product-description')
                  if desc: out['page_description_html']=str(desc)
                  for script in soup.find_all('script',attrs={'type':'application/ld+json'}):
                      try: data=json.loads(script.get_text(strip=True))
                      except Exception: continue
                      stack=data if isinstance(data,list) else [data]
                      while stack:
                          node=stack.pop()
                          if isinstance(node,list): stack.extend(node); continue
                          if not isinstance(node,dict): continue
                          typ=node.get('@type'); types=typ if isinstance(typ,list) else [typ]
                          if 'Product' in types:
                              brand=node.get('brand')
                              if isinstance(brand,dict): brand=brand.get('name')
                              if brand: out['jsonld_brand']=str(brand)
                          stack.extend(v for v in node.values() if isinstance(v,(dict,list)))
                  form=soup.select_one('form.variations_form[data-product_variations]')
                  if form:
                      raw=form.get('data-product_variations') or ''
                      try: out['variations']=json.loads(raw)
                      except Exception: pass
              except Exception as e: out['error']=repr(e)
              return out

          pages={}
          with ThreadPoolExecutor(max_workers=10) as pool:
              futures={pool.submit(parse_page,p):int(p['id']) for p in store}
              for i,f in enumerate(as_completed(futures),1):
                  pid=futures[f]
                  try: pages[pid]=f.result()
                  except Exception as e: pages[pid]={'product_id':pid,'error':repr(e),'variations':[]}
                  if i%50==0: print('pages',i,len(futures),flush=True)

          # Enrich variations when page markup is absent or incomplete.
          variation_ids=[]
          for product in store:
              for item in product.get('variations') or []:
                  vid=item.get('id') if isinstance(item,dict) else item
                  if vid: variation_ids.append(int(vid))
          variants={}
          def fetch_variant(vid):
              r=s.get(f'{BASE}/wp-json/wc/store/v1/products/{vid}',timeout=60); r.raise_for_status(); return vid,r.json()
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures=[pool.submit(fetch_variant,vid) for vid in variation_ids]
              for i,f in enumerate(as_completed(futures),1):
                  try: vid,data=f.result(); variants[vid]=data
                  except Exception as e: pass
                  if i%50==0: print('variants',i,len(futures),flush=True)

          products=[]
          for item in store:
              pid=int(item['id'])
              products.append({'store':item,'wp':wp_by_id.get(pid,{}),'page':pages.get(pid,{}),'variation_records':[variants.get(int(v.get('id') if isinstance(v,dict) else v),{}) for v in item.get('variations') or []]})

          summary={
              'fetched_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'store_products':len(store),'wp_products':len(wp),'variation_records':len(variants),
              'page_success':sum(1 for x in pages.values() if x.get('status')==200),
              'page_errors':sum(1 for x in pages.values() if x.get('error')),
              'currency_codes':sorted({(p.get('prices') or {}).get('currency_code') for p in store if (p.get('prices') or {}).get('currency_code')}),
          }
          (OUT/'Ibenry_Fresh_Source_Catalogue.json').write_text(json.dumps({'summary':summary,'products':products},ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'Ibenry_Fresh_Source_Summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
          python source/fetch_source.py | tee source/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibenry-fresh-source-catalogue-20260809
          path: source/
          retention-days: 1
          compression-level: 6
