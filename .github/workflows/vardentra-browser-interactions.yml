name: Vardentra browser interaction audit 2026-08-09

on:
  push:
    branches:
      - agent/vardentra-browser-interactions-20260809
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run browser-first checks
        shell: bash
        run: |
          mkdir -p audit/screenshots
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const BASE = new URL('https://vardentra.myshoplaza.com/');
          const PASSWORD = '123' + '456';
          const PRODUCT = '/products/bad-boy-magnum-54-in-24-hp-gas-zero-turn-mower';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              ignoreHTTPSErrors: true,
              locale: 'en-US',
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
            });
            const auth = await context.request.post(new URL('/api/password/v2', BASE).href, {
              form: { password: PASSWORD }, failOnStatusCode: false, maxRedirects: 10, timeout: 60000
            });
            const page = await context.newPage();
            const consoleErrors = [], pageErrors = [], failedRequests = [];
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push({ page: page.url(), text: message.text() }); });
            page.on('pageerror', error => pageErrors.push({ page: page.url(), text: String(error.stack || error) }));
            page.on('requestfailed', request => failedRequests.push({ page: page.url(), url: request.url(), reason: request.failure()?.errorText || '' }));

            const results = [];
            async function test(name, fn) {
              try { results.push({ name, status: 'PASS', details: await fn() }); }
              catch (error) { results.push({ name, status: 'FAIL', details: String(error.stack || error) }); }
            }
            async function goto(route, wait = 1000) {
              const response = await page.goto(new URL(route, BASE).href, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
              await sleep(wait);
              const title = await page.title();
              if (/Just a moment/i.test(title)) throw new Error(`Cloudflare challenge at ${route}`);
              return response;
            }

            await test('Homepage renders', async () => {
              const response = await goto('/', 2200);
              await page.screenshot({ path: 'audit/screenshots/home.png', fullPage: true });
              const h1 = clean(await page.locator('h1').first().innerText());
              const cards = await page.locator('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').count();
              return { status: response?.status(), url: page.url(), h1, product_cards: cards, title: await page.title() };
            });

            await test('Header Shop link', async () => {
              await goto('/');
              const link = page.getByRole('link', { name: /^shop$/i }).first();
              if (!await link.count()) throw new Error('Shop link missing');
              const href = await link.getAttribute('href');
              await link.click(); await page.waitForLoadState('domcontentloaded'); await sleep(500);
              if (!page.url().includes('/collections/')) throw new Error(`Unexpected destination ${page.url()}`);
              return { href, final_url: page.url() };
            });

            await test('Search submission', async () => {
              await goto('/');
              const input = page.locator('input[type="search"],input[name="q"],input[placeholder*="Search" i]').first();
              if (!await input.count()) throw new Error('Search input missing');
              await input.fill('mower'); await input.press('Enter');
              await page.waitForLoadState('domcontentloaded'); await sleep(1000);
              const cards = await page.locator('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').count();
              if (!page.url().includes('/search')) throw new Error(`Unexpected route ${page.url()}`);
              if (!cards) throw new Error('No search product cards');
              return { final_url: page.url(), cards };
            });

            await test('Collection pagination', async () => {
              await goto('/collections/all-products');
              const next = page.locator('.vd-pagination a[rel="next"],a[aria-label*="next" i],.pagination a:has-text("Next")').first();
              if (!await next.count()) throw new Error('Next pagination link missing');
              const href = await next.getAttribute('href');
              await next.click(); await page.waitForLoadState('domcontentloaded'); await sleep(500);
              return { href, final_url: page.url() };
            });

            await test('Product page metadata and gallery', async () => {
              await goto(PRODUCT, 1200);
              await page.screenshot({ path: 'audit/screenshots/product.png', fullPage: true });
              const text = clean(await page.locator('main,body').first().innerText());
              const meta = clean(await page.locator('.vd-product-identity,.vd-product-taxonomy,.product-meta,[data-product-meta]').first().innerText().catch(() => ''));
              const stage = page.locator('.vd-product-stage,.product-main-image,[data-product-stage]').first();
              const box = await stage.boundingBox();
              const related = await page.locator('[data-related-grid] [data-product-card],.vd-related [data-product-card],.related-products [data-product-card],.related-products .shoplazza-product-snippet').count();
              return {
                h1: clean(await page.locator('h1').first().innerText()),
                has_sku: /SKU\s*:/i.test(meta || text), has_category: /Category\s*:/i.test(meta || text), has_brand: /Brand\s*:/i.test(meta || text),
                gallery_box: box, related_cards: related,
                add_to_cart: await page.getByRole('button', { name: /add to cart/i }).count(),
                buy_now: await page.getByRole('button', { name: /buy now/i }).count()
              };
            });

            await test('Product gallery next/thumbnail', async () => {
              await goto(PRODUCT);
              const main = page.locator('[data-product-main-image],.vd-product-stage img,.product-main-image img').first();
              const before = await main.getAttribute('src').catch(() => '');
              const next = page.locator('[data-gallery-next],.vd-gallery-next,button[aria-label*="next" i]').first();
              if (await next.count()) { await next.click(); await sleep(500); return { method: 'next', changed: before !== await main.getAttribute('src').catch(() => '') }; }
              const thumbs = page.locator('.vd-product-thumbnails button,.vd-product-thumbnails img,[data-thumbnail]');
              if (await thumbs.count() > 1) { await thumbs.nth(1).click(); await sleep(500); return { method: 'thumbnail', changed: before !== await main.getAttribute('src').catch(() => '') }; }
              return { method: 'single-image', changed: false };
            });

            await test('Product tabs', async () => {
              await goto(PRODUCT);
              const reviews = page.getByRole('button', { name: /reviews/i }).first();
              const shipping = page.getByRole('button', { name: /shipping/i }).first();
              if (!await reviews.count() || !await shipping.count()) throw new Error('Tabs missing');
              await reviews.click(); await sleep(250); const reviewsSelected = await reviews.getAttribute('aria-selected');
              await shipping.click(); await sleep(250); const shippingSelected = await shipping.getAttribute('aria-selected');
              return { reviews_selected: reviewsSelected, shipping_selected: shippingSelected };
            });

            await test('Quantity increase', async () => {
              await goto(PRODUCT);
              const input = page.locator('input[name="quantity"],input[type="number"]').first();
              if (!await input.count()) throw new Error('Quantity input missing');
              const before = Number(await input.inputValue());
              const plus = page.locator('[data-quantity-plus],button[aria-label*="increase" i],button:has-text("+")').first();
              if (!await plus.count()) throw new Error('Increase button missing');
              await plus.click(); await sleep(250); const after = Number(await input.inputValue());
              if (!(after > before)) throw new Error(`${before} -> ${after}`);
              return { before, after };
            });

            await test('Add to Cart and remove', async () => {
              await goto(PRODUCT);
              const add = page.getByRole('button', { name: /add to cart/i }).first();
              if (!await add.count() || await add.isDisabled()) throw new Error('Add to Cart missing or disabled');
              await add.click(); await sleep(1400);
              await goto('/cart');
              const body = clean(await page.locator('body').innerText());
              if (/cart is empty|your cart is empty/i.test(body)) throw new Error('Cart remained empty');
              const remove = page.locator('[data-cart-remove],button[aria-label*="remove" i],a[aria-label*="remove" i],button:has-text("Remove"),a:has-text("Remove")').first();
              const found = await remove.count();
              if (found) { await remove.click(); await sleep(900); }
              return { added: true, remove_control: !!found };
            });

            await test('Buy Now button', async () => {
              await goto(PRODUCT);
              const button = page.getByRole('button', { name: /buy now/i }).first();
              if (!await button.count() || await button.isDisabled()) throw new Error('Buy Now missing or disabled');
              return await button.evaluate(node => ({ visible: !!(node.offsetWidth || node.offsetHeight), form_action: node.form?.action || '', type: node.type || '' }));
            });

            await test('Wishlist toggle', async () => {
              await goto(PRODUCT);
              const button = page.getByRole('button', { name: /wishlist/i }).first();
              if (!await button.count()) throw new Error('Wishlist missing');
              const before = await button.getAttribute('aria-pressed'); await button.click(); await sleep(300); const after = await button.getAttribute('aria-pressed');
              return { before, after };
            });

            await test('Compare toggle', async () => {
              await goto(PRODUCT);
              const button = page.getByRole('button', { name: /compare/i }).first();
              if (!await button.count()) throw new Error('Compare missing');
              const before = await button.getAttribute('aria-pressed'); await button.click(); await sleep(300); const after = await button.getAttribute('aria-pressed');
              return { before, after };
            });

            await test('Order Status form', async () => {
              await goto('/pages/order-status');
              await page.screenshot({ path: 'audit/screenshots/order-status.png', fullPage: true });
              const form = page.locator('form[action*="order_verify"],form:has(input[name="order_number"])').first();
              if (!await form.count()) throw new Error('Order form missing');
              const email = form.locator('input[name="email"]'); const order = form.locator('input[name="order_number"]');
              if (!await email.count() || !await order.count()) throw new Error('Required inputs missing');
              return { action: await form.getAttribute('action'), email_required: await email.getAttribute('required') !== null, order_required: await order.getAttribute('required') !== null };
            });

            await test('Mobile menu', async () => {
              const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, storageState: await context.storageState(), ignoreHTTPSErrors: true });
              const mobilePage = await mobile.newPage(); await mobilePage.goto(BASE.href, { waitUntil: 'domcontentloaded', timeout: 90000 }); await sleep(1000);
              const trigger = mobilePage.locator('[data-mobile-menu-trigger],button[aria-label*="menu" i],.mobile-menu-trigger').first();
              if (!await trigger.count()) throw new Error('Mobile menu trigger missing');
              await trigger.click(); await sleep(300);
              const shop = mobilePage.getByRole('link', { name: /^shop$/i }).first(); if (!await shop.count()) throw new Error('Mobile Shop missing');
              await mobilePage.screenshot({ path: 'audit/screenshots/mobile-home.png', fullPage: true });
              const href = await shop.getAttribute('href'); await mobile.close(); return { shop: href };
            });

            fs.writeFileSync('audit/results.json', JSON.stringify({ auth_status: auth.status(), results, consoleErrors, pageErrors, failedRequests }, null, 2));
            fs.writeFileSync('audit/REPORT.md', ['# Vardentra browser interaction audit','',...results.map(item => `- **${item.name}: ${item.status}** — ${typeof item.details === 'string' ? item.details : JSON.stringify(item.details)}`),'',`Console errors: ${consoleErrors.length}`,`Page errors: ${pageErrors.length}`,`Failed requests: ${failedRequests.length}`].join('\n'));
            await context.close(); await browser.close();
          })().catch(error => { fs.mkdirSync('audit',{recursive:true}); fs.writeFileSync('audit/FATAL.txt',String(error.stack||error)); process.exitCode=1; });
          JS
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vardentra-browser-interactions-20260809
          path: audit/
          retention-days: 1
          compression-level: 6
