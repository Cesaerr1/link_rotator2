name: Vardentra fast comprehensive audit 2026-08-09

on:
  push:
    branches:
      - agent/vardentra-live-audit-20260809
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 cheerio@1.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run audit
        env:
          STORE_URL: https://www.vardentra.com/
          VIEWER_PASSWORD: '123456'
        shell: bash
        run: |
          mkdir -p audit/screenshots audit/policies
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');
          const BASE = new URL(process.env.STORE_URL);
          const PASSWORD = process.env.VIEWER_PASSWORD;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
          const safe = value => value === '/' ? 'home' : value.replace(/^\//,'').replace(/[?&#=/]+/g,'-').replace(/-+$/,'').slice(0,150);
          const internal = href => { try { return new URL(href, BASE).hostname.replace(/^www\./,'') === BASE.hostname.replace(/^www\./,''); } catch { return false; } };
          const normalize = href => { try { const u=new URL(href,BASE); u.hash=''; u.searchParams.delete('spm'); u.searchParams.delete('spm_prev'); return u.href; } catch { return ''; } };
          const csv = (file, rows) => {
            if (!rows.length) return fs.writeFileSync(file,'');
            const heads=[...new Set(rows.flatMap(r=>Object.keys(r)))];
            const esc=v=>{const s=typeof v==='object'?JSON.stringify(v):String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
            fs.writeFileSync(file,[heads.map(esc).join(','),...rows.map(r=>heads.map(h=>esc(r[h])).join(','))].join('\n')+'\n');
          };

          const routes=[
            '/', '/collections/all-products','/collections/car-lift','/collections/cardio-machines','/collections/electric-bicycles','/collections/fishing-kayaks','/collections/garden-essentials','/collections/gazebo-pergolas','/collections/handy-mowers','/collections/home-finds','/collections/portable-generators','/collections/ride-mowers','/collections/sheds','/collections/swing-sets','/collections/trampoline',
            '/pages/about-us','/pages/contact-us','/pages/faqs','/pages/order-status','/pages/shipping-policy','/pages/refund-and-returns-policy','/pages/privacy-policy','/pages/terms-of-service','/pages/billing-policy','/pages/cookie-policy','/pages/wishlist','/pages/compare',
            '/cart','/search?q=mower','/account','/account/login','/account/register','/account/forgot-password','/order-verify','/account/order_lookup','/pages/billing-terms','/pages/warranty-policy','/pages/wholesale-policy','/pages/security-reporting'
          ];
          const policyRoutes=routes.filter(r=>r.startsWith('/pages/') && !['/pages/wishlist','/pages/compare'].includes(r));

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1050},ignoreHTTPSErrors:true,locale:'en-US'});
            const auth=await context.request.post(new URL('/api/password/v2',BASE).href,{form:{password:PASSWORD},failOnStatusCode:false,maxRedirects:10,timeout:60000});

            const products=new Map();
            for(const keyword of ['','mower','kayak','lift','bike','generator','shed','swing','trampoline','gazebo','cardio','garden','home']){
              for(let p=0;p<15;p++){
                try{
                  const res=await context.request.get(new URL('/api/search',BASE).href,{params:{keyword,page:p,limit:100},failOnStatusCode:false,timeout:45000});
                  if(res.status()>=400) break;
                  const json=await res.json().catch(()=>null); const list=json?.data?.products||[];
                  for(const item of list) if(item.handle) products.set(item.handle,item);
                  if(!list.length||!json?.data?.has_more) break;
                }catch{break}
              }
            }

            const routeRows=[]; const linkSet=new Set(); const policies={};
            for(const route of routes){
              try{
                const res=await context.request.get(new URL(route,BASE).href,{failOnStatusCode:false,maxRedirects:10,timeout:45000});
                const html=await res.text(); const $=cheerio.load(html);
                const title=clean($('title').first().text()); const h1=clean($('h1').first().text());
                const description=$('meta[name="description"]').attr('content')||''; const canonical=$('link[rel="canonical"]').attr('href')||'';
                const links=[]; $('a[href]').each((_,a)=>{const href=normalize($(a).attr('href')); if(href&&internal(href)){links.push(href);linkSet.add(href)}});
                const images=[]; $('img').each((_,img)=>{const src=normalize($(img).attr('src')||$(img).attr('data-src')||'');if(src)images.push(src)});
                const bodyText=clean($('main,#MainContent,[role="main"],body').first().text());
                routeRows.push({route,status:res.status(),final_url:res.url(),title,h1,meta_description:description,canonical,main_text_length:bodyText.length,internal_links:links.length,image_refs:images.length,has_h1:!!h1});
                if(policyRoutes.includes(route)){
                  $('script,style,nav,header,footer,form').remove();
                  const policyText=clean($('main,#MainContent,[role="main"],article,.page-content,body').first().text());
                  policies[route]={status:res.status(),final_url:res.url(),title,h1,text:policyText};
                  fs.writeFileSync(`audit/policies/${safe(route)}.txt`,policyText);
                }
              }catch(e){routeRows.push({route,error:String(e)})}
            }

            const allProducts=[...products.values()].sort((a,b)=>String(a.handle).localeCompare(String(b.handle)));
            const allProductChecks=[]; let pc=0;
            async function productWorker(){while(pc<allProducts.length){const product=allProducts[pc++];const route=`/products/${product.handle}`;try{const res=await context.request.get(new URL(route,BASE).href,{failOnStatusCode:false,maxRedirects:8,timeout:45000});const html=await res.text();allProductChecks.push({route,status:res.status(),final_url:res.url(),html_length:html.length,has_add_to_cart:/add to cart/i.test(html),has_title:/<h1/i.test(html)})}catch(e){allProductChecks.push({route,error:String(e)})}}}
            await Promise.all(Array.from({length:15},()=>productWorker()));

            const links=[...linkSet].slice(0,2500); const linkRows=[]; let lc=0;
            async function linkWorker(){while(lc<links.length){const href=links[lc++];try{const res=await context.request.get(href,{failOnStatusCode:false,maxRedirects:10,timeout:30000});linkRows.push({href,status:res.status(),final_url:res.url(),content_type:res.headers()['content-type']||''})}catch(e){linkRows.push({href,error:String(e)})}}}
            await Promise.all(Array.from({length:20},()=>linkWorker()));

            const page=await context.newPage(); const consoleErrors=[]; const pageErrors=[]; const failedRequests=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push({page:page.url(),text:m.text()})});
            page.on('pageerror',e=>pageErrors.push({page:page.url(),text:String(e.stack||e)}));
            page.on('requestfailed',r=>failedRequests.push({page:page.url(),url:r.url(),reason:r.failure()?.errorText||''}));

            async function goto(route,wait=700){const res=await page.goto(new URL(route,BASE).href,{waitUntil:'domcontentloaded',timeout:90000});await sleep(wait);return res}
            async function domAudit(route,screenshot=false){const res=await goto(route,route==='/'?2500:700);if(screenshot)await page.screenshot({path:`audit/screenshots/${safe(route)}.png`,fullPage:true}).catch(()=>{});return await page.evaluate(()=>{const visible=e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length);const main=document.querySelector('main,#MainContent,[role=main]')||document.body;const images=[...document.images].map(i=>({src:i.currentSrc||i.src,displayed:visible(i),complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight}));return{url:location.href,title:document.title,h1:document.querySelector('h1')?.innerText?.trim()||'',mainText:(main.innerText||'').replace(/\s+/g,' ').trim(),brokenImages:images.filter(i=>i.displayed&&(!i.complete||!i.naturalWidth)),productCards:document.querySelectorAll('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').length,overflow:document.body.scrollWidth>document.body.clientWidth+2,buttons:[...document.querySelectorAll('button,input[type="submit"],a[role="button"],.button,.btn')].filter(visible).map(b=>({text:(b.innerText||b.value||b.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),disabled:!!b.disabled||b.getAttribute('aria-disabled')==='true',href:b.href||'',formAction:b.form?.action||''})),forms:[...document.forms].map(f=>({action:f.action,method:f.method,inputs:[...f.elements].map(e=>({name:e.name,type:e.type,required:!!e.required})).filter(x=>x.name)}))}})}

            const domRows=[];
            for(const route of ['/','/collections/all-products','/pages/order-status','/cart','/search?q=mower']){try{domRows.push({route,...await domAudit(route,true)})}catch(e){domRows.push({route,error:String(e)})}}

            const sampleCount=Math.min(32,allProducts.length);const productRows=[];
            for(let i=0;i<sampleCount;i++){
              const product=allProducts[Math.floor(i*allProducts.length/sampleCount)];const route=`/products/${product.handle}`;
              try{await goto(route,800);const data=await page.evaluate(()=>{const visible=e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length);const meta=[...document.querySelectorAll('.vd-product-identity li,.vd-product-taxonomy li,.product-meta li,[data-product-meta]')].map(x=>(x.innerText||'').replace(/\s+/g,' ').trim());const desc=document.querySelector('[data-tab-panel="description"],.vd-product-description,.product-description,.rte');const gallery=document.querySelector('.vd-product-gallery,.product-gallery,[data-product-gallery]');const stage=gallery?.querySelector('.vd-product-stage,.product-main-image,[data-product-stage]');const imgs=[...document.images].map(i=>({displayed:visible(i),complete:i.complete,naturalWidth:i.naturalWidth}));return{title:document.querySelector('h1')?.innerText?.trim()||'',meta,sku:[...document.querySelectorAll('[data-sku-value],[data-product-sku],.vd-product-sku,.sku')].map(x=>(x.innerText||'').trim()).filter(Boolean),prices:[...document.querySelectorAll('.vd-product-price,.price,[data-product-price],.money')].map(x=>(x.innerText||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,8),descWords:(desc?.innerText||'').trim().split(/\s+/).filter(Boolean).length,aspect:stage?{w:stage.getBoundingClientRect().width,h:stage.getBoundingClientRect().height}:null,related:document.querySelectorAll('[data-related-grid] [data-product-card],.vd-related [data-product-card],.related-products [data-product-card],.shoplazza-product-snippet').length,broken:imgs.filter(i=>i.displayed&&(!i.complete||!i.naturalWidth)).length,overflow:document.body.scrollWidth>document.body.clientWidth+2}});productRows.push({route,api_sku:product.sku||'',api_price:product.price??'',api_compare:product.compare_at_price??'',displayed_sku:data.sku.join(' | '),displayed_category:/Category\s*:/i.test(data.meta.join(' ')),displayed_brand:/Brand\s*:/i.test(data.meta.join(' ')),meta_text:data.meta.join(' | '),displayed_prices:data.prices.join(' | '),description_words:data.descWords,gallery_w:data.aspect?.w||'',gallery_h:data.aspect?.h||'',related_cards:data.related,broken_images:data.broken,horizontal_overflow:data.overflow})}catch(e){productRows.push({route,error:String(e)})}
            }

            const interactions=[];async function test(name,fn){try{interactions.push({name,status:'PASS',details:JSON.stringify(await fn()||{})})}catch(e){interactions.push({name,status:'FAIL',details:String(e.stack||e)})}}
            const testProduct=allProducts.find(p=>p.available!==false&&(p.variants||[]).length<=1)||allProducts[0];const testUrl=`/products/${testProduct?.handle||''}`;

            await test('Header Shop link',async()=>{await goto('/');const link=page.getByRole('link',{name:/^shop$/i}).first();if(!await link.count())throw Error('Shop link missing');const href=await link.getAttribute('href');const res=await context.request.get(new URL(href,BASE).href,{failOnStatusCode:false});if(res.status()>=400)throw Error(`Shop link ${res.status()}`);return{href,status:res.status()}});
            await test('Search submission',async()=>{await goto('/');const input=page.locator('input[type="search"],input[name="q"],input[placeholder*="Search" i]').first();if(!await input.count())throw Error('Search input missing');await input.fill('mower');await input.press('Enter');await sleep(800);if(!page.url().includes('/search'))throw Error(page.url());const cards=await page.locator('[data-product-card],.vd-api-product-card,.vd-product-card,.shoplazza-product-snippet').count();if(!cards)throw Error('No result cards');return{url:page.url(),cards}});
            await test('Product tabs',async()=>{await goto(testUrl);const reviews=page.getByRole('button',{name:/reviews/i}).first();const shipping=page.getByRole('button',{name:/shipping/i}).first();if(!await reviews.count()||!await shipping.count())throw Error('Tabs missing');await reviews.click();await shipping.click();return{reviews:true,shipping:true}});
            await test('Quantity increase',async()=>{await goto(testUrl);const qty=page.locator('input[name="quantity"],input[type="number"]').first();if(!await qty.count())throw Error('Quantity missing');const before=Number(await qty.inputValue());const plus=page.locator('[data-quantity-plus],button[aria-label*="increase" i],button:has-text("+")').first();if(!await plus.count())throw Error('Plus missing');await plus.click();const after=Number(await qty.inputValue());if(!(after>before))throw Error(`${before}->${after}`);return{before,after}});
            await test('Add to Cart and cart view',async()=>{await goto(testUrl);const add=page.getByRole('button',{name:/add to cart/i}).first();if(!await add.count()||await add.isDisabled())throw Error('Add button missing/disabled');await add.click();await sleep(1200);await goto('/cart');const body=clean(await page.locator('body').innerText());if(/cart is empty|your cart is empty/i.test(body))throw Error('Cart stayed empty');return{cart_has_item:true}});
            await test('Buy Now available',async()=>{await goto(testUrl);const buy=page.getByRole('button',{name:/buy now/i}).first();if(!await buy.count()||await buy.isDisabled())throw Error('Buy Now missing/disabled');return await buy.evaluate(b=>({formAction:b.form?.action||'',type:b.type||'',visible:!!(b.offsetWidth||b.offsetHeight)}))});
            await test('Wishlist toggle',async()=>{await goto(testUrl);const b=page.getByRole('button',{name:/wishlist/i}).first();if(!await b.count())throw Error('Wishlist missing');const before=await b.getAttribute('aria-pressed');await b.click();const after=await b.getAttribute('aria-pressed');return{before,after}});
            await test('Compare toggle',async()=>{await goto(testUrl);const b=page.getByRole('button',{name:/compare/i}).first();if(!await b.count())throw Error('Compare missing');const before=await b.getAttribute('aria-pressed');await b.click();const after=await b.getAttribute('aria-pressed');return{before,after}});
            await test('Collection pagination',async()=>{await goto('/collections/all-products');const next=page.locator('.vd-pagination a[rel="next"],a[aria-label*="next" i],.pagination a:has-text("Next")').first();if(!await next.count())throw Error('Next pagination missing');const href=await next.getAttribute('href');const res=await context.request.get(new URL(href,BASE).href,{failOnStatusCode:false});if(res.status()>=400)throw Error(String(res.status()));return{href,status:res.status()}});
            await test('Order Status form',async()=>{await goto('/pages/order-status');const form=page.locator('form[action*="order_verify"],form:has(input[name="order_number"])').first();if(!await form.count())throw Error('Order form missing');const email=form.locator('input[name="email"]');const order=form.locator('input[name="order_number"]');if(!await email.count()||!await order.count())throw Error('Required inputs missing');const responsePromise=page.waitForResponse(r=>r.url().includes('/api/order_verify'),{timeout:20000}).catch(()=>null);await email.fill('audit-no-order@example.com');await order.fill('AUDIT-000000');await form.locator('button[type="submit"],input[type="submit"]').first().click();const res=await responsePromise;return{api_status:res?.status()||'',action:await form.getAttribute('action')}});

            const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,storageState:await context.storageState(),ignoreHTTPSErrors:true});const mp=await mobile.newPage();
            await test('Mobile menu',async()=>{await mp.goto(BASE.href,{waitUntil:'domcontentloaded',timeout:90000});const t=mp.locator('[data-mobile-menu-trigger],button[aria-label*="menu" i],.mobile-menu-trigger').first();if(!await t.count())throw Error('Menu trigger missing');await t.click();await sleep(300);const shop=mp.getByRole('link',{name:/^shop$/i}).first();if(!await shop.count())throw Error('Mobile Shop link missing');return{shop:await shop.getAttribute('href')}});
            await mp.screenshot({path:'audit/screenshots/mobile-home.png',fullPage:true}).catch(()=>{});await mobile.close();

            const policyFindings=[];const low=Object.fromEntries(Object.entries(policies).map(([r,d])=>[r,clean(d.text).toLowerCase()]));const pages=rx=>Object.entries(low).filter(([,t])=>rx.test(t)).map(([r])=>r);const add=(severity,issue,pg,evidence)=>policyFindings.push({severity,issue,pages:[...new Set(pg)].join(' | '),evidence});
            const old=pages(/ibenry|ibenry group|ibenry\.com|contact@ibenry|1550 blairs ferry|319[\s\-.()]*305[\s\-.]*8352/i);if(old.length)add('CRITICAL','Old source identity remains',old,'Legacy brand/contact found');
            const platform=pages(/wordpress|woocommerce|shopify/i);if(platform.length)add('HIGH','Wrong platform reference',platform,'Legacy platform wording');
            const intl=pages(/international (delivery|shipping)|outside the united states|ship internationally/i),us=pages(/united states only|only ship within the united states|ship only to/i);if(intl.length&&us.length)add('HIGH','Shipping destination conflict',[...intl,...us],'International and U.S.-only terms coexist');
            const free=pages(/free (standard )?shipping|shipping is free/i),calc=pages(/shipping (is|will be) calculated at checkout|calculated at checkout/i);if(free.length&&calc.length)add('HIGH','Shipping cost conflict',[...free,...calc],'Free shipping and calculated-at-checkout coexist');
            const unused=pages(/must be unused|unused.{0,80}original/i),used=pages(/slightly used|gently used|used products/i);if(unused.length&&used.length)add('HIGH','Return condition conflict',[...unused,...used],'Unused-only and used-product returns coexist');
            const sec=pages(/100% (safe|secure)|level 1 pci|pci dss|128-bit ssl|guaranteed secure/i);if(sec.length)add('MEDIUM','Unsupported security/compliance claim',sec,'Absolute security/PCI/SSL claim');
            const bounty=pages(/bounty|cash reward|safe harbor/i);if(bounty.length)add('HIGH','Security bounty promise needs active program',bounty,'Bounty or safe-harbor language');
            const warranty=pages(/three-year warranty|3-year warranty/i);if(warranty.length)add('HIGH','Blanket warranty requires proof',warranty,'Three-year warranty for all products');
            for(const [route,data] of Object.entries(policies)){const t=clean(data.text).toLowerCase();if(['/pages/contact-us','/pages/privacy-policy','/pages/terms-of-service','/pages/shipping-policy','/pages/refund-and-returns-policy','/pages/billing-policy'].includes(route)&&!t.includes('support@vardentra.com'))add('HIGH','Support email missing',[route],'support@vardentra.com');if(route==='/pages/contact-us'&&!t.replace(/\D/g,'').includes('15125776043'))add('HIGH','Phone missing on Contact page',[route],'+1 5125776043');if(route==='/pages/contact-us'&&!t.includes('7889 s oakleaf st'))add('HIGH','Address missing on Contact page',[route],'7889 S Oakleaf St, Bennett, CO 80102, USA')}

            const titleGroups={};const descGroups={};for(const r of routeRows){if(r.title)(titleGroups[r.title]??=[]).push(r.route);if(r.meta_description)(descGroups[r.meta_description]??=[]).push(r.route)}const duplicateTitles=Object.entries(titleGroups).filter(([,v])=>v.length>1);const duplicateDescriptions=Object.entries(descGroups).filter(([,v])=>v.length>1);
            const summary={audited_at:new Date().toISOString(),auth_status:auth.status(),products_discovered:allProducts.length,product_routes_checked:allProductChecks.length,product_route_errors:allProductChecks.filter(r=>Number(r.status)>=400||r.error).length,routes_http_audited:routeRows.length,internal_links_checked:linkRows.length,broken_internal_links:linkRows.filter(r=>Number(r.status)>=400||r.error).length,dom_routes_audited:domRows.length,broken_displayed_images:domRows.reduce((n,r)=>n+(r.brokenImages?.length||0),0),dom_horizontal_overflow:domRows.filter(r=>r.overflow).map(r=>r.route),product_pages_sampled:productRows.length,product_missing_sku:productRows.filter(r=>!r.displayed_sku).map(r=>r.route),product_missing_category:productRows.filter(r=>!r.displayed_category).map(r=>r.route),product_missing_brand:productRows.filter(r=>!r.displayed_brand).map(r=>r.route),product_short_description:productRows.filter(r=>Number(r.description_words)<20).map(r=>r.route),product_non_square_gallery:productRows.filter(r=>r.gallery_w&&Math.abs(Number(r.gallery_w)-Number(r.gallery_h))>8).map(r=>r.route),product_missing_related:productRows.filter(r=>Number(r.related_cards)===0).map(r=>r.route),interaction_pass:interactions.filter(r=>r.status==='PASS').length,interaction_fail:interactions.filter(r=>r.status==='FAIL').length,policy_findings:policyFindings.length,duplicate_titles:duplicateTitles.length,duplicate_meta_descriptions:duplicateDescriptions.length,console_errors:consoleErrors.length,page_errors:pageErrors.length,failed_requests:failedRequests.length};

            csv('audit/routes.csv',routeRows);csv('audit/links.csv',linkRows);csv('audit/dom.csv',domRows);csv('audit/products.csv',productRows);csv('audit/all-product-routes.csv',allProductChecks);csv('audit/interactions.csv',interactions);csv('audit/policy-findings.csv',policyFindings);fs.writeFileSync('audit/policies.json',JSON.stringify(policies,null,2));fs.writeFileSync('audit/results.json',JSON.stringify({summary,routeRows,linkRows,domRows,productRows,allProductChecks,interactions,policyFindings,duplicateTitles,duplicateDescriptions,consoleErrors,pageErrors,failedRequests},null,2));
            const report=['# Vardentra fast comprehensive audit','',`**Audited:** ${summary.audited_at}`,'', '## Coverage','',`- Products discovered: **${summary.products_discovered}**`,`- Product routes checked: **${summary.product_routes_checked}**`,`- Routes audited: **${summary.routes_http_audited}**`,`- Internal links checked: **${summary.internal_links_checked}**`,`- Product pages browser-sampled: **${summary.product_pages_sampled}**`,`- Safe interaction tests: **${interactions.length}**`,'','## Results','',`- Broken internal links: **${summary.broken_internal_links}**`,`- Product route errors: **${summary.product_route_errors}**`,`- Broken displayed images: **${summary.broken_displayed_images}**`,`- Interaction passes: **${summary.interaction_pass}**`,`- Interaction failures: **${summary.interaction_fail}**`,`- Policy/conflict findings: **${summary.policy_findings}**`,`- Duplicate audited titles: **${summary.duplicate_titles}**`,`- Duplicate audited meta descriptions: **${summary.duplicate_meta_descriptions}**`,'','## Product sample','',`- Missing SKU: **${summary.product_missing_sku.length}**`,`- Missing Category: **${summary.product_missing_category.length}**`,`- Missing Brand: **${summary.product_missing_brand.length}**`,`- Short descriptions: **${summary.product_short_description.length}**`,`- Non-square galleries: **${summary.product_non_square_gallery.length}**`,`- Missing Related Products: **${summary.product_missing_related.length}**`,'','## Interactions','',...interactions.map(r=>`- **${r.name}: ${r.status}** — ${r.details}`),'','## Policy findings','',...(policyFindings.length?policyFindings.map(r=>`- **${r.severity}: ${r.issue}** — ${r.pages} — ${r.evidence}`):['- No heuristic conflict detected; manual legal review remains necessary.']),'','## Boundary','','No order, payment, contact message, review, or account change was submitted.'].join('\n');fs.writeFileSync('audit/AUDIT_REPORT.md',report+'\n');
